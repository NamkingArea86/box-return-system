<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางคะแนนผู้ใช้</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        .leaderboard-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        .leaderboard-table th, .leaderboard-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .leaderboard-table th { background-color: #4CAF50; color: white; font-weight: 600; }
        .rank-1 { background-color: #fff9c4; font-weight: bold; }
        .points-badge { background: #2E7D32; color: white; padding: 5px 12px; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🏆 อันดับคะแนนสะสม</h2>

    <div class="box">
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th style="width: 50px;">อันดับ</th>
                    <th>ชื่อ / เบอร์โทร</th>
                    <th style="text-align: right;">คะแนน</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr>
                    <td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span> หน้าหลัก
        </a>
        <a href="rewards.html" class="nav-item active">
            <span class="nav-icon">🎁</span> รางวัล
        </a>
    </div>

    <script src="js/app.js"></script>

    <script>
        // ไม่ต้องประกาศ firebaseConfig ซ้ำ
        // รอให้หน้าจอโหลดเสร็จ แล้วสั่งรันฟังก์ชันจาก app.js
        window.onload = function() {
            if (typeof loadLeaderboard === 'function') {
                loadLeaderboard();
            } else {
                console.error("ไม่พบฟังก์ชัน loadLeaderboard ใน app.js");
            }
        };
    </script>
</body>
</html>
