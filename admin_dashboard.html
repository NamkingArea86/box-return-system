<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - รายการค้างส่ง</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .borrow-card { padding: 15px; margin: 10px; border-radius: 12px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 8px solid #2196F3; }
        .overdue { border-left: 8px solid #f44336 !important; background: #ffebee !important; }
        .timer { font-weight: bold; font-family: monospace; font-size: 18px; }
        .overdue-text { color: #d32f2f; font-weight: bold; }
        
        /* สไตล์ปุ่มเพิ่มเติม */
        .btn-back {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div style="display: flex; align-items: center; padding: 5px;">
        <button class="btn-back" onclick="location.href='admin_panel_secret.html'">⬅️ กลับเมนูแอดมิน</button>
    </div>

    <h2 style="text-align:center; margin-top:10px;">📋 รายการที่ยังไม่คืน</h2>
    
    <div id="adminActiveList">
        <p style="text-align:center; color:#999;">กำลังตรวจสอบข้อมูล...</p>
    </div>

    <div style="margin-top: 30px; text-align: center; padding-bottom: 50px;">
        <button onclick="location.href='admin_panel_secret.html'" style="background: #2E7D32; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(46,125,50,0.2);">
            🏠 กลับสู่เมนูแอดมิน
        </button>
    </div>

    <script src="js/app.js"></script>
    <script>
        window.onload = function() {
            if(typeof loadActiveBorrows === 'function') {
                loadActiveBorrows();
            }
        };
    </script>
</body>
</html>
