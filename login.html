<!DOCTYPE html>
<html lang="th">
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script src="js/app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/app.js"></script>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="logo-icon">🔐</div>
        <h2>เข้าสู่ระบบ</h2>
        <p>กรุณาล็อกอินเพื่อใช้งาน</p>

        <div style="text-align: left;">
            <label>เบอร์โทรศัพท์</label>
            <div class="input-icon-wrapper">
                <span class="input-icon">📱</span>
                <input type="tel" id="loginPhone" placeholder="เบอร์โทรศัพท์" maxlength="10">
            </div>
            
            <label>รหัสผ่าน</label>
            <div class="input-icon-wrapper">
                <span class="input-icon">🔑</span>
                <input type="password" id="loginPassword" placeholder="รหัสผ่าน">
            </div>
        </div>

        <button onclick="performLogin()" style="margin-top: 15px;">เข้าสู่ระบบ</button>
        
        <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
            <span style="color:#888; font-size:14px;">ยังไม่มีบัญชีใช่ไหม?</span><br>
            <a href="register.html" style="color:#2E7D32; font-weight:bold; text-decoration:none; display:inline-block; margin-top:5px;">
                📝 ลงทะเบียนสมาชิกใหม่
            </a>
        </div>
    </div>

</body>

</html>
