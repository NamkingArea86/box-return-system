<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แลกรางวัล - ระบบคืนกล่อง</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        .points-box {
            text-align: center; 
            background: linear-gradient(to bottom, #ffffff, #f1f8e9);
            padding: 30px 15px;
            border-radius: 15px;
            margin: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e8f5e9;
        }
        .tab-container { display: flex; margin: 10px 15px; gap: 10px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: #eee;
            border-radius: 10px; cursor: pointer; font-family: inherit;
        }
        .tab-btn.active { background: #2E7D32; color: white; }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }
        .empty-state { text-align: center; margin-top: 40px; color: #888; }
        .empty-icon { font-size: 50px; display: block; margin-bottom: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="points-box">
        <p style="color:#555; margin-bottom:5px;">คะแนนคงเหลือของคุณ</p>
        <h1 style="margin:0; font-size: 3.5rem; color:#2E7D32;" id="points">0</h1>
        <p style="font-size: 0.9rem; color: #888;">แต้มสะสม</p>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="btn-redeem" onclick="switchTab('redeem')">🎁 แลกรางวัล</button>
        <button class="tab-btn" id="btn-my" onclick="switchTab('myRewards')">🎫 รางวัลของฉัน</button>
    </div>

    <div id="redeem" class="tab-content active">
        <div class="empty-state">
             <span class="empty-icon">🎁</span>
             <h3>ของรางวัลเร็วๆ นี้</h3>
             <p style="font-size:14px; color:#888;">สะสมแต้มรอไว้ได้เลย!<br>เรากำลังจัดเตรียมของรางวัลพิเศษให้คุณ</p>
        </div>
    </div>

    <div id="myRewards" class="tab-content">
        <h3 style="margin-bottom:15px;">คูปองที่แลกแล้ว</h3>
        <div id="myRewardList">
             <div class="empty-state">
                <span class="empty-icon">🎫</span>
                <p>ยังไม่มีรายการรางวัล</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span> หน้าหลัก
        </a>
        <a href="scan_borrow.html" class="nav-item">
            <span class="nav-icon">📥</span> ยืม
        </a>
        <a href="scan_return.html" class="nav-item">
            <span class="nav-icon">📤</span> คืน
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📘</span> ประวัติ
        </a>
        <a href="rewards.html" class="nav-item active">
            <span class="nav-icon">🎁</span> รางวัล
        </a>
    </div>

    <script src="js/app.js"></script>

    <script>
        // เมื่อเปิดหน้าจอให้ทำงานทันที
        window.onload = function() {
            // เรียกฟังก์ชันจาก app.js เพื่อดึงแต้มจริงจาก Firebase
            if (typeof loadUserData === 'function') {
                loadUserData(); 
            }
        };

        // ฟังก์ชันสลับ Tab
        function switchTab(tabName) {
            // ซ่อนทุก content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // เอาสีปุ่มออก
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // แสดงตัวที่เลือก
            document.getElementById(tabName).classList.add('active');
            // ใส่สีปุ่มที่เลือก
            if(tabName === 'redeem') document.getElementById('btn-redeem').classList.add('active');
            if(tabName === 'myRewards') document.getElementById('btn-my').classList.add('active');
        }
    </script>
</body>
</html>
