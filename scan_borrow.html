<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืมกล่อง - ระบบคืนกล่อง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>📥 ยืมกล่อง</h2>
        <div class="box">
            <p><strong>1. ระบุหมายเลขกล่อง:</strong></p>
            <input type="text" id="boxInput" placeholder="เช่น 001" style="width:100%; padding:12px; margin-top:8px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">

            <p style="margin-top:20px;"><strong>2. เลือกสถานที่ยืม (ร้านค้า):</strong></p>
            <select id="shopSelect" style="width:100%; padding:12px; margin-top:8px; border-radius:8px; border:1px solid #ddd;">
                <option value="">-- กรุณาเลือกสถานที่ --</option>
                <option value="ร้านกาแฟอาคาร A">ร้านกาแฟอาคาร A</option>
                <option value="โรงอาหารกลาง">โรงอาหารกลาง</option>
                <option value="ห้องสมุดชั้น 1">ห้องสมุดชั้น 1</option>
            </select>

            <button onclick="borrowBox()" style="margin-top:30px; width:100%; padding:15px; background:#4CAF50; color:white; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer;">
                ยืนยันการยืม
            </button>
        </div>
    </div>
