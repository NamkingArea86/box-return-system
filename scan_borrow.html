<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืมกล่อง - ระบบคืนกล่อง</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        /* CSS เพิ่มเติมเพื่อให้หน้ายืมดูดีขึ้น */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-top: 10px;
        }
        .btn-upload {
            border: 2px dashed #ddd;
            color: #666;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .btn-upload input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box; /* สำคัญมาก: กัน input ทะลุขอบ */
            font-size: 16px;
        }
        #previewImage {
            display: none;
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2E7D32; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📥 ยืมกล่อง</h2>

        <div class="box">
            <p><strong>1. ระบุหมายเลขกล่อง:</strong></p>
            <input type="text" id="boxInput" placeholder="เช่น 001">

            <p style="margin-top: 15px;"><strong>2. เลือกสถานที่ยืม (ร้านค้า):</strong></p>
            <select id="shopSelect">
                <option value="">-- กรุณาเลือกสถานที่ --</option>
                <option value="ร้านกาแฟอาคาร A">ร้านกาแฟอาคาร A</option>
                <option value="โรงอาหารกลาง">โรงอาหารกลาง</option>
                <option value="ห้องสมุดชั้น 1">ห้องสมุดชั้น 1</option>
                <option value="สถาบันนวัตกรรมฯ">สถาบันนวัตกรรมฯ</option>
                <option value="หน้าคณะวิศวฯ">หน้าคณะวิศวฯ</option>
            </select>

            <p style="margin-top: 15px;"><strong>3. เลือกรูปภาพจากเครื่อง:</strong></p>
            <div class="upload-btn-wrapper">
                <div class="btn-upload">
                    <span style="font-size:30px;">🖼️</span>
                    <span>กดเพื่อเลือกจากอัลบั้ม</span>
                    <input type="file" id="imageInput" accept="image/*" onchange="showPreview(event)">
                </div>
            </div>

            <img id="previewImage" alt="ตัวอย่างรูปภาพ">

            <button id="btnSubmit" onclick="borrowBoxWithImage()" style="margin-top:25px; width: 100%; padding: 15px; background:#4CAF50; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;">
                ยืนยันการยืม
            </button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span> หน้าหลัก
        </a>
        <a href="scan_borrow.html" class="nav-item active">
            <span class="nav-icon">📥</span> ยืม
        </a>
        <a href="scan_return.html" class="nav-item">
            <span class="nav-icon">📤</span> คืน
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📘</span> ประวัติ
        </a>
        <a href="rewards.html" class="nav-item">
            <span class="nav-icon">🎁</span> รางวัล
        </a>
    </div>

    <script src="js/app.js"></script>

    <script>
        // ฟังก์ชันแสดงตัวอย่างรูปภาพ
        function showPreview(event) {
            const output = document.getElementById('previewImage');
            if (event.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function() {
                    output.src = reader.result;
                    output.style.display = 'block';
                };
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
