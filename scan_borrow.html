<h2>📥 ยืมกล่อง</h2>

<div class="box">
    <p>1. ระบุหมายเลขกล่อง:</p>
    <input type="text" id="boxInput" placeholder="เช่น 001">

    <p style="margin-top: 15px;">2. เลือกสถานที่ยืม (ร้านค้า):</p>
    <select id="shopSelect" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
        <option value="">-- กรุณาเลือกสถานที่ --</option>
        <option value="ร้านกาแฟอาคาร A">ร้านกาแฟอาคาร A</option>
        <option value="โรงอาหารกลาง">โรงอาหารกลาง</option>
        <option value="ห้องสมุดชั้น 1">ห้องสมุดชั้น 1</option>
        <option value="สถาบันนวัตกรรมฯ">สถาบันนวัตกรรมฯ</option>
    </select>

    <p style="margin-top: 15px;">3. เลือกรูปภาพจากเครื่อง (รูปกล่อง/สถานที่):</p>
    <div class="upload-btn-wrapper">
        <div class="btn-upload">
            <span style="font-size:25px;">🖼️</span>
            <span>เลือกจากอัลบั้ม</span>
            <input type="file" id="imageInput" accept="image/*" onchange="showPreview(event)">
        </div>
    </div>

    <img id="previewImage" alt="ตัวอย่างรูปภาพ" style="display:none; width:100%; margin-top:10px; border-radius:10px;">

    <button id="btnSubmit" onclick="borrowBackground()" style="margin-top:20px; background:#4CAF50;">
        ยืนยันการยืม
    </button>
</div>
