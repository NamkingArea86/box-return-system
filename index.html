    <h2>📦 ระบบติดตามการยืม-คืน</h2>

    <div class="box">

        <p><strong>ชื่อ:</strong> <span id="username">กำลังโหลด...</span></p>
        <p><strong>รหัสนักศึกษา:</strong> <span id="userid">...</span></p>
        <p><strong>เบอร์โทร:</strong> <span id="userphone">...</span></p>
        <p><strong>คณะ:</strong> <span id="userfaculty">...</span></p>
        <p><strong>ชั้นปี:</strong> <span id="useryear">...</span></p>
    
        <div style="background:#f9fbe7; padding:15px; border-radius:10px; text-align:center; border:1px dashed #cddc39; margin-top:15px;">

            <strong style="font-size:32px; color:#2E7D32;" id="points">0</strong>
            <br>
            <span style="font-size:12px; color:#666;">คืนกล่องแล้ว: <span id="returnCountDisplay">0</span> ครั้ง</span>
