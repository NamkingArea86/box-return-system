<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ประวัติการใช้งานทั้งหมด</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        .admin-header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
        }
        .btn-back {
            background: #666;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            float: left;
        }
        .history-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        /* เพิ่มสไตล์ปุ่มด้านล่าง */
        .admin-footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px 15px 50px 15px;
        }
        .btn-home-admin {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div style="float: right;">
        <a href="admin_panel_secret.html" class="admin-nav-btn">⬅️ เมนูแอดมิน</a>
    </div>

    <div class="admin-header">
        <h2 style="margin:0;">🛠️ แผงควบคุมแอดมิน</h2>
        <p style="margin:5px 0 0 0; font-size:14px; opacity:0.8;">ประวัติการยืม-คืนทั้งหมดในระบบ</p>
    </div>

    <div class="container" style="padding: 15px;">
        <div id="adminHistoryList">
            <p style="text-align:center; padding:50px;">กำลังโหลดข้อมูลจากระบบ...</p>
        </div>
    </div>

    <script src="js/app.js"></script>

    <script>
    window.onload = function() {
        if (typeof fetchAllHistory === 'function') {
            fetchAllHistory();
        }
    };
    </script>

</body>
</html>
