<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ประวัติการใช้งานทั้งหมด</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        .admin-header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
        }
        .btn-back {
            background: #666;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            float: left;
        }
        .history-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        .delete-btn {
            position: absolute;
            top: 15px; /* ย้ายไปไว้มุมขวาบนแทน */
            right: 15px;
            background: #fff5f5;
            color: #e53935;
            border: 1px solid #ffcdd2;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: #e53935;
            color: white;
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <a href="user_points.html" class="btn-back">⬅️ กลับ</a>
        <h2 style="margin:0;">🛠️ แผงควบคุมแอดมิน</h2>
        <p style="margin:5px 0 0 0; font-size:14px; opacity:0.8;">ประวัติการยืม-คืนทั้งหมดในระบบ</p>
    </div>

    <div class="container" style="padding: 15px;">
        <div id="adminHistoryList">
            <p style="text-align:center; padding:50px;">กำลังโหลดข้อมูลจากระบบ...</p>
        </div>
    </div>

    <script src="js/app.js"></script>

    <script>
        // ฟังก์ชันดึงประวัติทั้งหมด
        async function fetchAllHistory() {
            const container = document.getElementById('adminHistoryList');
            try {
                // ดึงข้อมูลเรียงตามเวลาล่าสุด
                const snapshot = await db.collection("transactions")
                    .orderBy("timestamp", "desc")
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:50px; color:#888;">
                            <span style="font-size:50px;">Empty</span>
                            <p>ยังไม่มีประวัติการทำรายการ</p>
                        </div>`;
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const docId = doc.id; // ใช้สำหรับลบ
                    const isBorrow = item.type === 'borrow';
                    const color = isBorrow ? '#4CAF50' : '#FF9800';
                    
                    html += `
                        <div class="history-card" style="border-left: 6px solid ${color};">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong style="color:${color}; font-size:16px;">
                                    ${isBorrow ? '📥 ยืมกล่อง' : '📤 คืนกล่อง'}
                                </strong>
                                <small style="color:#888;">${item.date || ''}</small>
                            </div>
                            <div style="font-size:14px; margin-top:8px; line-height:1.6;">
                                👤 <b>ผู้ใช้:</b> ${item.userPhone}<br>
                                📦 <b>เลขกล่อง:</b> ${item.boxId}<br>
                                📍 <b>สถานที่:</b> ${item.shopName || 'ไม่ระบุ'}
                            </div>
                            <button class="delete-btn" onclick="deleteHistory('${docId}')">🗑️ ลบ</button>
                        </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = "<p style='color:red; text-align:center;'>ข้อผิดพลาด: " + e.message + "</p>";
            }
        }

        // ฟังก์ชันลบประวัติ (Admin Only)
        async function deleteHistory(id) {
            if (!confirm("⚠️ ยืนยันการลบ? \nหากเป็นรายการ 'คืนกล่อง' แต้มจะถูกหักออก 5 แต้ม และจำนวนครั้งจะลดลงทันที")) {
                return;
            }

            try {
                // 1. ดึงข้อมูลรายการที่จะลบมาเช็คก่อนว่าเป็นของใคร และเป็นประเภทไหน
                const docRef = db.collection("transactions").doc(id);
                const docSnap = await docRef.get();

                if (!docSnap.exists) {
                    alert("ไม่พบข้อมูลรายการนี้");
                    return;
                }

                const data = docSnap.data();
                const userPhone = data.userPhone;
                const type = data.type; // 'borrow' หรือ 'return'

                // 2. ถ้าเป็นรายการ 'คืน (return)' ต้องหักแต้มคืน 5 แต้ม และลดจำนวนครั้งคืนลง 1
                if (type === 'return') {
                    const userRef = db.collection("users").doc(userPhone);
                
                    // ใช้ FieldValue.increment(-ค่า) เพื่อหักลบจำนวน
                    await userRef.update({
                        points: firebase.firestore.FieldValue.increment(-5),
                        returnCount: firebase.firestore.FieldValue.increment(-1)
                    });
                console.log("หักแต้มและจำนวนครั้งคืนสำเร็จ");
                }
    
                // 3. ลบรายการประวัติออกจาก transactions
                await docRef.delete();

                alert("ลบรายการและปรับปรุงคะแนนผู้ใช้สำเร็จ");
                fetchAllHistory(); // รีโหลดหน้าจอใหม่
    
            } catch (e) {
                console.error("Delete Error:", e);
                alert("ลบไม่สำเร็จ: " + e.message);
            }
        }

        // รันฟังก์ชันเมื่อเปิดหน้า
        window.onload = function() {
            if (typeof db !== 'undefined') {
                fetchAllHistory();
            } else {
                alert("Firebase ไม่พร้อมใช้งาน ตรวจสอบไฟล์ app.js");
            }
        };
    </script>
</body>
</html>
