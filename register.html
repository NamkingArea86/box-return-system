<!DOCTYPE html>
<html lang="th">
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - ระบบยืมคืน</title>
    <link rel="stylesheet" href="style.css">
    
    </head>
<body class="login-page">

    <div class="login-container">
        <div class="logo-icon">📝</div>
        <h2>ลงทะเบียนสมาชิกใหม่</h2>
        <p>กรุณากรอกข้อมูลเพื่อเริ่มใช้งาน</p>

        <div style="text-align: left;">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="regName" placeholder="เช่น สมชาย ใจดี">
            
            <label>คณะ / สาขาวิชา</label>
            <select id="regFaculty" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">
                <option value="">-- เลือกคณะ --</option>
                <option value="วิศวกรรมศาสตร์">วิศวกรรมศาสตร์</option>
                <option value="บริหารธุรกิจ">บริหารธุรกิจ</option>
                <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                <option value="ศิลปศาสตร์">ศิลปศาสตร์</option>
            </select>
            
            <label>ชั้นปีที่เรียน</label>
            <select id="regYear" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">
                <option value="">-- เลือกชั้นปี --</option>
                <option value="ปี 1">ปี 1</option>
                <option value="ปี 2">ปี 2</option>
                <option value="ปี 3">ปี 3</option>
                <option value="ปี 4">ปี 4</option>
                <option value="อื่นๆ">อื่นๆ (เช่น ปริญญาโท/เอก)</option>
            </select>
            <label>เบอร์โทรศัพท์ (ใช้เป็นชื่อเข้าสู่ระบบ)</label>
            <div class="input-icon-wrapper">
                <span class="input-icon">📞</span>
                <input type="tel" id="regPhone" placeholder="0xx-xxx-xxxx" maxlength="10">
            </div>

            <label>กำหนดรหัสผ่าน</label>
            <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่านของคุณ">
            
            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" id="regConfirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง">
        </div>

        <button onclick="performRegister()" style="margin-top: 15px; background: #FF9800;">ลงทะเบียน</button>
        
        <div style="margin-top: 20px;">
            <a href="login.html" style="color:#2E7D32; text-decoration:none;">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
        </div>
    </div>

    <script src="js/app.js"></script>

</body>
</html>
