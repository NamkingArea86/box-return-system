<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .menu-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: 0.3s;
        }
        .menu-card:active { transform: scale(0.95); }
        .menu-icon { font-size: 40px; display: block; margin-bottom: 10px; }
        .menu-title { font-weight: bold; color: #2E7D32; }
    </style>
</head>
<body>

    <h2>⚙️ ระบบจัดการหลังบ้าน (Admin)</h2>
    <p style="color: #666; font-size: 14px;">ยินดีต้อนรับแอดมิน กรุณาเลือกรายการที่ต้องการตรวจสอบ</p>

    <div class="admin-menu-grid">
        <a href="admin.html" class="menu-card">
            <span class="menu-icon">📋</span>
            <span class="menu-title">รายการยืม-คืน</span>
            <p style="font-size: 12px; color: #888; margin-top: 5px;">ดูประวัติและรูปถ่าย</p>
        </a>

        <a href="user_points.html" class="menu-card">
            <span class="menu-icon">🏆</span>
            <span class="menu-title">คะแนนผู้ใช้</span>
            <p style="font-size: 12px; color: #888; margin-top: 5px;">ดูแต้มสะสมทั้งหมด</p>
        </a>

        <a href="https://console.firebase.google.com/" target="_blank" class="menu-card" style="grid-column: span 2;">
            <span class="menu-icon">🔥</span>
            <span class="menu-title">จัดการฐานข้อมูล (Firebase)</span>
        </a>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <button onclick="location.href='index.html'" style="background: #eee; color: #555; width: auto; padding: 10px 20px; font-size: 14px;">
            🏠 กลับหน้าหลักของผู้ใช้
        </button>
    </div>

</body>
</html>
