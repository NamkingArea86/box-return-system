<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการยืม-คืน</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <style>
        .empty-state { text-align: center; margin-top: 50px; color: #888; }
        .empty-icon { font-size: 60px; display: block; margin-bottom: 15px; opacity: 0.5; }
        .history-container { padding: 10px; margin-bottom: 70px; }
        h2 { text-align: center; color: #2E7D32; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>📘 ประวัติการยืม-คืน</h2>

    <div style="margin: 15px; padding: 15px; background: #e3f2fd; border-radius: 12px; text-align: center; border: 1px solid #bbdefb;">
        <span style="font-size: 14px; color: #555;">จำนวนครั้งที่คืนกล่องสะสม</span>
        <div style="font-size: 24px; font-weight: bold; color: #1976d2;">
            <span id="returnCountDisplay">0</span> ครั้ง
        </div>
    </div>

    <div id="activeBorrowSection" style="display: none; margin: 15px; padding: 15px; background: #fff3e0; border-radius: 12px; border: 1px solid #ffe0b2;">
        <div style="font-size: 14px; color: #e65100; font-weight: bold; margin-bottom: 5px;">⚠️ กรุณาคืนภายใน 24 ชม.</div>
        <div style="font-size: 18px; color: #333;">เวลาที่เหลือ: <span id="countdownTimer" style="color: #d32f2f; font-weight: bold; font-family: monospace;">--:--:--</span></div>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">ยืมเมื่อ: <span id="borrowTimeDisplay">-</span></div>
    </div>

    <div id="historyBox" class="history-container">
        <p style="text-align:center; color:#999;">กำลังโหลดประวัติจากระบบ...</p>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> หน้าหลัก</a>
        <a href="scan_borrow.html" class="nav-item"><span class="nav-icon">📥</span> ยืม</a>
        <a href="scan_return.html" class="nav-item"><span class="nav-icon">📤</span> คืน</a>
        <a href="history.html" class="nav-item active"><span class="nav-icon">📘</span> ประวัติ</a>
        <a href="rewards.html" class="nav-item"><span class="nav-icon">🎁</span> รางวัล</a>
    </div>

    <script src="js/app.js"></script>

</body>
</html>
