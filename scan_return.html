<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คืนกล่อง - ระบบคืนกล่อง</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="container">
        <h2>📤 คืนกล่อง</h2>
        <div class="box">
            <p><strong>1. ใส่หมายเลขกล่องที่ต้องการคืน:</strong></p>
            <input type="text" id="boxInputReturn" placeholder="เช่น 001" style="width:100%; padding:12px; margin-top:8px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">

            <p style="margin-top:20px;"><strong>2. สแกน QR Code ที่จุดคืนกล่อง:</strong></p>
            <div id="reader" style="width: 100%; border-radius: 10px; overflow: hidden; margin-top:10px; border: 1px solid #ccc;"></div>
            <p style="font-size:12px; color:#666; text-align:center; margin-top:10px;">*กรุณาใส่เลขกล่องก่อนสแกน*</p>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">🏠 หน้าหลัก</a>
        <a href="scan_borrow.html" class="nav-item">📥 ยืม</a>
        <a href="scan_return.html" class="nav-item active">📤 คืน</a>
        <a href="history.html" class="nav-item">📘 ประวัติ</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/app.js"></script>
    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start({ facingMode: "environment" }, qrConfig, (decodedText) => {
            html5QrCode.stop(); 
            returnBoxWithQR(decodedText);
        }).catch(err => {
            console.error("กล้องทำงานผิดพลาด", err);
        });
    </script>
</body>
</html>
